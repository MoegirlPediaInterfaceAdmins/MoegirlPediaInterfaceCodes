extends: stylelint-config-standard

reportDescriptionlessDisables: true

reportInvalidScopeDisables: true

reportNeedlessDisables: true

ignoreFiles:
  - dist/**/*.css
  - src/gadgets/JSONViewer/Gadget-JSONViewer.css
  - src/gadgets/Navigation_popups/Gadget-popups.css
  - src/gadgets/prism-core/Gadget-prism-line-numbers.css
  - src/gadgets/prism-plugin-match-braces/Gadget-prism-plugin-match-braces.css
  - src/gadgets/prism-plugin-previewers/Gadget-prism-plugin-previewers.css

plugins:
  - stylelint-plugin-use-baseline

rules:
  custom-property-pattern:
    - ^([a-z][a-z0-9]*)(-{1,2}[a-z0-9]+)*$
    - message: Custom property name must be kebab-case, with single or double hyphens
        allowed.
  selector-id-pattern: null
  selector-class-pattern: null
  no-descending-specificity: null
  number-max-precision: null
  selector-no-vendor-prefix: null
  value-no-vendor-prefix: null
  at-rule-no-vendor-prefix: null
  media-feature-name-no-vendor-prefix: null
  property-no-vendor-prefix: null
  selector-attribute-quotes: null
  function-no-unknown:
    - true
    - ignoreFunctions:
        - alpha
  comment-empty-line-before: null
  selector-type-no-unknown:
    - true
    - ignoreTypes:
        - ogvjs
        - rb
        - moe-badges
        - moe-badge
  no-duplicate-selectors: null
  declaration-property-value-no-unknown: true
  plugin/use-baseline:
    - true
    - severity: warning
      available: newly
      ignoreProperties:
        user-select:
          - /^(?:auto|text|none|all)$/
        resize:
          - /^(?:none|both|horizontal|vertical|block|inline)$/

overrides:
  - files:
      - packages/**/*.scss
    customSyntax: postcss-scss
    rules:
      at-rule-no-unknown:
        - true
        - ignoreAtRules:
            - use
            - mixin
            - include
            - content
      no-invalid-double-slash-comments: null
