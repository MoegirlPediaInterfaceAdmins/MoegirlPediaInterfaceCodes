# 构建链 vendor 目标：从 node_modules/<moduleName>/<distFilePath> 读取文件，
# 加上生成头后写到 dist/_generated/gadgets/<gadget.name>/<gadget.fileName>。
# 版本由 package-lock.json 固定，升级经 dependabot 的 lock PR 人工合并。

- moduleName: json5
  distFilePath: dist/index.js
  gadget:
    name: libJSON5
    fileName: Gadget-libJSON5.js
- moduleName: localforage
  distFilePath: dist/localforage.js
  gadget:
    name: localforage
    fileName: Gadget-localforage.js
- moduleName: prismjs
