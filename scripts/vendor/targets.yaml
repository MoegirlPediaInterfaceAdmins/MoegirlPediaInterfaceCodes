    name: prism-core
    fileName: Gadget-prism-line-numbers.js
- moduleName: prismjs
  distFilePath: plugins/line-numbers/prism-line-numbers.css
  gadget:
    name: prism-core
    fileName: Gadget-prism-line-numbers.css
